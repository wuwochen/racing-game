/* ---------- 音频系统 V2（多层引擎声 + 换挡音效 + 背景音乐） ---------- */
let actx, started=false;
let engMain=null, engSub=null, engNoise=null;   // 振荡器
let engMainGain, engSubGain, engNoiseGain;       // 各层增益
let engMasterGain;                               // 总输出
let engFilter;                                    // 低通滤波器
let engSubFilter;
let curGear=1, prevGear=1;
let lastEngineFreq=60;
let bgmGain=null, bgmScheduler=null, bgmStep=0, bgmNextTime=0;

function toggleSound(){
  soundOn=!soundOn;
  if(engMasterGain) engMasterGain.gain.value = soundOn?0.35:0;
  if(bgmGain) bgmGain.gain.setTargetAtTime(soundOn?0.25:0, actx?actx.currentTime:0, 0.1);
}

function initAudio(){
  if(started) return; started=true;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();

    // === 主输出 ===
    engMasterGain = actx.createGain();
    engMasterGain.gain.value = 0;
    engMasterGain.connect(actx.destination);

    // === 引擎主层：方波（低频厚重感）===
    engMain = actx.createOscillator();
    engMain.type = 'square';
    engMain.frequency.value = 55;
    engMainGain = actx.createGain();
    engMainGain.gain.value = 0.6;
    engFilter = actx.createBiquadFilter();
    engFilter.type = 'lowpass';
    engFilter.frequency.value = 600;
    engFilter.Q.value = 4;
    engMain.connect(engFilter);
    engFilter.connect(engMainGain);
    engMainGain.connect(engMasterGain);
    engMain.start();

    // === 引擎副层：锯齿波（高频泛音，模拟排气声）===
    engSub = actx.createOscillator();
    engSub.type = 'sawtooth';
    engSub.frequency.value = 110;
    engSubGain = actx.createGain();
    engSubGain.gain.value = 0.25;
    engSubFilter = actx.createBiquadFilter();
    engSubFilter.type = 'bandpass';
    engSubFilter.frequency.value = 800;
    engSubFilter.Q.value = 2;
    engSub.connect(engSubFilter);
    engSubFilter.connect(engSubGain);
    engSubGain.connect(engMasterGain);
    engSub.start();

    // === 白噪声层（模拟进气/机械噪音）===
    const noiseBufSize = actx.sampleRate * 2;
    const noiseBuf = actx.createBuffer(1, noiseBufSize, actx.sampleRate);
    const noiseData = noiseBuf.getChannelData(0);
    for(let i=0; i<noiseBufSize; i++) noiseData[i] = (Math.random()*2-1) * 0.3;
    engNoise = actx.createBufferSource();
    engNoise.buffer = noiseBuf;
    engNoise.loop = true;
    engNoiseGain = actx.createGain();
    engNoiseGain.gain.value = 0.08;
    const noiseFilter = actx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = 2000;
    noiseFilter.Q.value = 0.8;
    engNoise.connect(noiseFilter);
    noiseFilter.connect(engNoiseGain);
    engNoiseGain.connect(engMasterGain);
    engNoise.start();

    soundOn=true;
    engMasterGain.gain.value = 0.35;

    // === 背景音乐：电子赛车风格 BGM ===
    bgmGain = actx.createGain();
    bgmGain.gain.value = 0.25;
    bgmGain.connect(actx.destination);
    bgmStep = 0;
    bgmNextTime = actx.currentTime + 0.1;
    scheduleBGM();
  }catch(e){ console.warn('Audio init failed:', e); }
}

/* === 背景音乐：步进式合成器 === */
// 音阶（A 小调五声音阶 + 低音）
const BGM_BASS = [55, 55, 0, 55, 41.2, 41.2, 0, 49];        // 低音线（A1-A1-_-A1-E1-E1-_-G1）
const BGM_LEAD = [220, 0, 261.6, 0, 329.6, 261.6, 220, 0,   // 主旋律
                   196, 0, 246.9, 0, 329.6, 246.9, 196, 0];
const BGM_ARP  = [220, 261.6, 329.6, 440, 329.6, 261.6, 220, 261.6]; // 琶音
const BGM_STEPS = 16;   // 16 步循环
const BGM_STEP_TIME = 0.18; // 每步约 167 BPM

function scheduleBGM(){
  if(!actx || !bgmGain) return;
  const ahead = 0.3;  // 提前 300ms 调度
  while(bgmNextTime < actx.currentTime + ahead){
    const step = bgmStep % BGM_STEPS;
    const t = bgmNextTime;

    // 低音线（每 2 步一个长音）
    if(step % 2 === 0){
      const bassIdx = (step/2) | 0;
      const freq = BGM_BASS[bassIdx % BGM_BASS.length];
      if(freq > 0){
        playBassNote(freq, t, BGM_STEP_TIME * 1.8);
      }
    }

    // 主旋律（每步一个音或休止）
    const leadFreq = BGM_LEAD[step];
    if(leadFreq > 0){
      playLeadNote(leadFreq, t, BGM_STEP_TIME * 0.9);
    }

    // 琶音层（每步一个短音，赛感氛围）
    const arpFreq = BGM_ARP[step % BGM_ARP.length];
    playArpNote(arpFreq, t, BGM_STEP_TIME * 0.5);

    // 鼓点：步 0/4/8/12 踢鼓，步 4/12 军鼓
    if(step === 0 || step === 8){ playKick(t); }
    if(step === 4 || step === 12){ playSnare(t); }
    // 镲片：每步一个轻微 hi-hat
    playHat(t, step % 2 === 0 ? 0.3 : 0.15);

    bgmNextTime += BGM_STEP_TIME;
    bgmStep++;
  }
  // 下一帧继续调度
  bgmScheduler = requestAnimationFrame(scheduleBGM);
}

function playBassNote(freq, t, dur){
  const osc = actx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.value = freq;
  const gain = actx.createGain();
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.25, t+0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t+dur);
  const filter = actx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 400;
  filter.Q.value = 6;
  osc.connect(filter); filter.connect(gain); gain.connect(bgmGain);
  osc.start(t); osc.stop(t+dur+0.05);
}

function playLeadNote(freq, t, dur){
  const osc1 = actx.createOscillator();
  const osc2 = actx.createOscillator();
  osc1.type = 'square'; osc1.frequency.value = freq;
  osc2.type = 'triangle'; osc2.frequency.value = freq * 1.005;  // 轻微失谐
  const gain = actx.createGain();
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.08, t+0.008);
  gain.gain.exponentialRampToValueAtTime(0.001, t+dur);
  const filter = actx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 2000;
  osc1.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(bgmGain);
  osc1.start(t); osc1.stop(t+dur+0.05);
  osc2.start(t); osc2.stop(t+dur+0.05);
}

function playArpNote(freq, t, dur){
  const osc = actx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.value = freq * 2;  // 高八度
  const gain = actx.createGain();
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.04, t+0.005);
  gain.gain.exponentialRampToValueAtTime(0.001, t+dur);
  osc.connect(gain); gain.connect(bgmGain);
  osc.start(t); osc.stop(t+dur+0.05);
}

function playKick(t){
  const osc = actx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(120, t);
  osc.frequency.exponentialRampToValueAtTime(40, t+0.08);
  const gain = actx.createGain();
  gain.gain.setValueAtTime(0.4, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t+0.15);
  osc.connect(gain); gain.connect(bgmGain);
  osc.start(t); osc.stop(t+0.2);
}

function playSnare(t){
  // 噪声军鼓
  const bufSize = actx.sampleRate * 0.1;
  const buf = actx.createBuffer(1, bufSize, actx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1) * Math.exp(-i/(actx.sampleRate*0.02));
  const src = actx.createBufferSource();
  src.buffer = buf;
  const filter = actx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 1000;
  const gain = actx.createGain();
  gain.gain.value = 0.15;
  src.connect(filter); filter.connect(gain); gain.connect(bgmGain);
  src.start(t);
}

function playHat(t, vol){
  const bufSize = actx.sampleRate * 0.03;
  const buf = actx.createBuffer(1, bufSize, actx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1) * Math.exp(-i/(actx.sampleRate*0.005));
  const src = actx.createBufferSource();
  src.buffer = buf;
  const filter = actx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 6000;
  const gain = actx.createGain();
  gain.gain.value = vol * 0.1;
  src.connect(filter); filter.connect(gain); gain.connect(bgmGain);
  src.start(t);
}

/* === 换挡音效 === */
function playShiftSound(){
  if(!actx || !soundOn) return;
  const now = actx.currentTime;

  // 1. 换挡 "咔" 声 — 短促的噪声脉冲
  const clickBuf = actx.createBuffer(1, actx.sampleRate*0.05, actx.sampleRate);
  const clickData = clickBuf.getChannelData(0);
  for(let i=0; i<clickData.length; i++){
    clickData[i] = (Math.random()*2-1) * Math.exp(-i/(actx.sampleRate*0.01));
  }
  const click = actx.createBufferSource();
  click.buffer = clickBuf;
  const clickGain = actx.createGain();
  clickGain.gain.value = 0.5;
  const clickFilter = actx.createBiquadFilter();
  clickFilter.type = 'bandpass';
  clickFilter.frequency.value = 3000;
  clickFilter.Q.value = 3;
  click.connect(clickFilter);
  clickFilter.connect(clickGain);
  clickGain.connect(engMasterGain);
  click.start(now);

  // 2. 引擎转速骤降再回升（模拟离合器断开-接合）
  if(engMain){
    engMain.frequency.cancelScheduledValues(now);
    engMain.frequency.setValueAtTime(lastEngineFreq, now);
    engMain.frequency.exponentialRampToValueAtTime(lastEngineFreq * 0.55, now + 0.08);
    engMain.frequency.exponentialRampToValueAtTime(lastEngineFreq * 0.85, now + 0.25);
  }
  if(engSub){
    engSub.frequency.cancelScheduledValues(now);
    engSub.frequency.setValueAtTime(lastEngineFreq * 2, now);
    engSub.frequency.exponentialRampToValueAtTime(lastEngineFreq * 1.1, now + 0.08);
    engSub.frequency.exponentialRampToValueAtTime(lastEngineFreq * 1.7, now + 0.25);
  }
  // 副层音量短暂降低（离合断开瞬间排气变弱）
  if(engSubGain){
    engSubGain.gain.cancelScheduledValues(now);
    engSubGain.gain.setValueAtTime(0.25, now);
    engSubGain.gain.linearRampToValueAtTime(0.08, now + 0.05);
    engSubGain.gain.linearRampToValueAtTime(0.25, now + 0.30);
  }
}

/* === 更新引擎音效（每帧调用） === */
function updateEngineSound(){
  if(!actx || !engMain) return;
  const speed = Math.abs(player.fSpeed||0);
  const gear = playerGear || 1;

  // 基础频率：低速低频，高速高频，但每档有上限（模拟换挡前转速攀升）
  const gearMaxRPM = [0, 0.25, 0.45, 0.65, 0.85, 1.0]; // 各档最高转速比例
  const gearMin = [0, 0.08, 0.20, 0.35, 0.50, 0.65];   // 各档最低转速比例
  const speedRatio = speed / CFG.MAX_SPEED;
  const gearRange = gearMaxRPM[gear] - gearMin[gear];
  const withinGear = Math.max(0, Math.min(1, (speedRatio - gearMin[gear]) / Math.max(0.01, gearRange)));

  // 主层频率：50Hz(怠速) ~ 220Hz(红线)
  const targetFreq = 50 + withinGear * 170 + (gear-1) * 8;
  // 副层频率：主层的 ~2 倍（泛音）
  const targetSubFreq = targetFreq * 2.1;

  // 平滑过渡
  lastEngineFreq = lastEngineFreq + (targetFreq - lastEngineFreq) * 0.15;
  engMain.frequency.setTargetAtTime(lastEngineFreq, actx.currentTime, 0.02);
  if(engSub) engSub.frequency.setTargetAtTime(targetSubFreq, actx.currentTime, 0.02);

  // 滤波器频率随转速开扬（低转速闷，高转速亮）
  if(engFilter) engFilter.frequency.setTargetAtTime(400 + withinGear * 1200, actx.currentTime, 0.05);
  if(engSubFilter) engSubFilter.frequency.setTargetAtTime(500 + withinGear * 2000, actx.currentTime, 0.05);

  // 油门控制音量（给油更响）
  const throttleBoost = inp().throttle ? 0.15 : 0;
  if(engMainGain) engMainGain.gain.setTargetAtTime(0.5 + throttleBoost, actx.currentTime, 0.05);
  if(engSubGain && !engSubGain.gain._shifting) engSubGain.gain.setTargetAtTime(0.2 + throttleBoost, actx.currentTime, 0.05);

  // 噪声层随转速增强
  if(engNoiseGain) engNoiseGain.gain.setTargetAtTime(0.04 + withinGear * 0.12, actx.currentTime, 0.05);

  // 检测换挡（档位变化时播放换挡音）
  if(gear !== curGear){
    prevGear = curGear;
    curGear = gear;
    playShiftSound();
  }
}

/* ---------- 主循环 ---------- */
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt = Math.min(33, ts-last); last=ts;
  if(state==='menu') { renderer.render(scene,camera); return; }

  if(state==='countdown'){
    countdown -= dt;
    const sec=Math.ceil(countdown/1000);
    document.getElementById('countdown').textContent = sec>0?sec:'GO!';
    updateCarMeshes(); updateCamera(true);
    renderer.render(scene,camera);
    if(countdown<=0){
      state='race'; raceStart=performance.now();
      cars.forEach(c=>c.lapStart=raceStart);
      document.getElementById('overlay').classList.add('hidden');
    }
    return;
  }

  // free / race / finished
  const p=inp();
  if(gearShiftCooldown>0) gearShiftCooldown--;
  const nt=nearestOnTrack(player.x,player.y);
  player.onTrack = nt.dist < TRACK_WIDTH/2;  // 赛道内=路面，赛道外=草坪减速
  player.physics(p.throttle,p.brake,p.steer,p.hand);
  player.integrate();
  if(state !== 'free') player.checkLap(performance.now());

  // AI 车更新
  aiCars.forEach(c=>{
    try{
      const nt2=nearestOnTrack(c.x,c.y, c.trackIdx); c.onTrack = nt2.dist<TRACK_WIDTH/2;
      const a=c.aiControl();
      let thr=a.throttle, brk=a.brake, str=a.steer;
      // 城市自由模式：AI 车行为更随机、更慢
      if(isCityMode){
        thr *= c.aiSpeed;
        // 偶尔轻微随机变道
        if(Math.random() < 0.03) str += (Math.random()-0.5)*0.3;
        // 偶尔减速（模拟交通）
        if(Math.random() < 0.01) brk = Math.max(brk, 0.4);
      }
      const ctl={throttle:thr, brake:brk, steer:str, hand:a.hand};
      c.physics(ctl.throttle,ctl.brake,ctl.steer,ctl.hand);
      c.integrate();
      if(state !== 'free') c.checkLap(performance.now());
    }catch(e){}
  });

  resolveCollisions();
  resolveBuildingCollisions();

  addSkidMarks();
  updateCarMeshes();
  updateCamera(false);
  updateEngineSound();

  if(state !== 'free'){ updateStanding(); }
  updateHUD();
  drawMinimap();

  if(state !== 'free' && player.finished && state!=='finished'){
    state='finished';
    setTimeout(()=>{ showResults(); }, 2000);
  }
  renderer.render(scene,camera);
}

/* ---------- 同步 3D 网格到物理状态 ---------- */
function updateCarMeshes(){
  cars.forEach(c=>{
    if(!c.mesh) return;
    // 车身动态：侧倾（横向滑移）+ 俯仰（加速/刹车点头抬头）
    const isDrifting = Math.abs(c.lSpeed) > 1.8;
    const driftFactor = isDrifting ? Math.min(1, (Math.abs(c.lSpeed) - 1.8) / 3) : 0;
    // 漂移时侧倾更大（最高0.35弧度），正常行驶温和（最高0.18）
    const baseRoll = THREE.MathUtils.clamp(-c.lSpeed*0.04, -0.18, 0.18);
    const driftRoll = -c.lSpeed * 0.08 * driftFactor;
    const roll = THREE.MathUtils.clamp(baseRoll + driftRoll, -0.35, 0.35);
    // 加速时抬头、刹车时点头
    let pitch = 0;
    if(c.isPlayer){
      const p = inp();
      if(p.brake && c.fSpeed > 0.5) pitch = 0.04;   // 刹车点头
      else if(p.throttle && c.fSpeed < 8) pitch = -0.03; // 加速抬头
    } else {
      if(c.fSpeed > 0.5 && c.aiControl) {
        pitch = -c.fSpeed * 0.002;
      }
    }
    pitch = THREE.MathUtils.clamp(pitch, -0.05, 0.05);
    // 漂移车身摇晃（前后俯仰抖动）
    let driftShake = 0;
    if(isDrifting && Math.abs(c.fSpeed) > 3){
      driftShake = Math.sin(performance.now() * 0.02 + c.x) * 0.015 * driftFactor;
    }
    pitch += driftShake;
    // 碰撞抖动：碰撞后短暂随机晃动
    let hitYaw=0, hitRoll=0;
    if(c._hitTime){
      const elapsed = performance.now() - c._hitTime;
      if(elapsed < 400){
        const decay = 1 - elapsed/400;
        const force = Math.min((c._hitForce||1)*0.05, 0.15) * decay;
        hitYaw = Math.sin(elapsed*0.08) * force;
        hitRoll = Math.cos(elapsed*0.06) * force * 0.6;
      } else { c._hitTime=0; }
    }
    c.mesh.position.set(c.x, 0, c.y);
    c.mesh.rotation.set(pitch + hitYaw*0.3, -c.angle + hitYaw, roll + hitRoll);

    // === 车轮动画 ===
    const wheels = c.mesh.userData.wheels;
    if(wheels){
      // 滚动速度 = 车速 / 轮半径
      const wheelCircumference = 2 * Math.PI * (CAR_TYPES[c.carTypeIdx||0].wheelR);
      const spinAngle = (c.fSpeed || 0) / wheelCircumference * Math.PI * 2;
      // 前轮转向角度
      let steerAngle = 0;
      if(c.isPlayer){
        steerAngle = inp().steer * 0.5; // 前轮最大偏转约28°
      } else if(c.aiControl){
        const a = c.aiControl();
        steerAngle = a.steer * 0.5;
      }
      wheels.forEach(w=>{
        // 滚动旋转：车轮轴线沿Z轴，向前滚 = 绕Z轴旋转
        w.spin.rotation.z += spinAngle * 0.1;
        // 前轮转向偏转（绕Y轴，方向与车身转向一致）
        if(w.isFront){
          // 平滑插值到目标转向角（取反，因为车身 rotation.y = -angle）
          const target = -steerAngle;
          const cur = w.group.rotation.y;
          w.group.rotation.y = cur + (target - cur) * 0.2;
        }
      });
    }
    
    // === 双闪灯 + 转向灯闪烁 ===
    const hazLights = c.mesh.userData.hazardLights;
    if(hazLights && hazLights.length){
      const steer = c.isPlayer ? inp().steer : (c.aiControl ? c.aiControl().steer : 0);
      const isHazOn = c.isPlayer ? hazardLights : (c._autoHaz || false);
      // 闪烁相位 ~1.5Hz
      const blinkOn = Math.sin(performance.now() * 0.008) > 0;
      
      hazLights.forEach(l=>{
        const side = l.userData.side;  // 1=右, -1=左
        let lit = false;
        
        if(isHazOn){
          // 双闪：所有灯同步闪
          lit = blinkOn;
        } else if(c.isPlayer && steer !== 0){
          // 转向灯：左转亮左侧，右转亮右侧
          if((steer < 0 && side === -1) || (steer > 0 && side === 1)){
            lit = blinkOn;
          }
        }
        
        l.material.emissiveIntensity = lit ? 1.8 : 0.1;
      });
    }
    
    // === 车头灯锥光 ===
    if(c.mesh.userData.headlightCones){
      const coneIntensity = isNight ? (headlightsOn ? 4.0 : 3.0) : (headlightsOn ? 2.5 : 0);
      c.mesh.userData.headlightCones.forEach(hc => {
        hc.intensity = coneIntensity;
        hc.visible = coneIntensity > 0;
      });
    }
  });
}
function updateCamera(snap){
  const fx=Math.cos(player.angle), fy=Math.sin(player.angle);
  const k = carScale(player.carTypeIdx)/2;
  if(firstPerson){
    // 第一人称：车头位置，稍微抬高，看前方
    const eyeX = player.x + fx * 1.5 * k;
    const eyeZ = player.y + fy * 1.5 * k;
    const eyeY = 2.2 * k;
    camera.position.set(eyeX, eyeY, eyeZ);
    const lax = player.x + fx*15*k, laz = player.y + fy*15*k;
    camera.lookAt(lax, 1.5*k, laz);
    return;
  }
  // 第三人称追尾
  const dist = (13 + Math.min(6, player.speed*0.5)) * k;
  const tx = player.x - fx*dist + player.vx*3*k;
  const tz = player.y - fy*dist + player.vy*3*k;
  const ty = 6.5 * k;
  if(snap){ camPos.x=tx; camPos.y=ty; camPos.z=tz; }
  else {
    camPos.x += (tx-camPos.x)*0.12;
    camPos.y += (ty-camPos.y)*0.12;
    camPos.z += (tz-camPos.z)*0.12;
  }
  camera.position.set(camPos.x, camPos.y, camPos.z);
  const lax = player.x + fx*9*k, laz = player.y + fy*9*k;
  camera.lookAt(lax, 1.5, laz);
}

}

/* ---------- 小地图 ---------- */
const mm=document.getElementById('minimap'), mmx=mm.getContext('2d');
function drawMinimap(){
  mmx.clearRect(0,0,mm.width,mm.height);
  const pad=14, sx=(mm.width-pad*2)/WORLD.w, sy=(mm.height-pad*2)/WORLD.h, s=Math.min(sx,sy);
  const ox=pad, oy=pad;
  mmx.strokeStyle='#6e7681'; mmx.lineWidth=8; mmx.lineJoin='round'; mmx.lineCap='round';
  mmx.beginPath();
  for(let i=0;i<track.length;i++){const p=track[i]; const x=ox+p.x*s,y=oy+p.y*s; if(i===0)mmx.moveTo(x,y); else mmx.lineTo(x,y);}
  mmx.closePath(); mmx.stroke();
  mmx.strokeStyle='#c9d1d9'; mmx.lineWidth=2.5; mmx.stroke();
  cars.forEach(c=>{
    mmx.fillStyle=c.isPlayer?'#ffd33d':c.color;
    mmx.beginPath(); mmx.arc(ox+c.x*s, oy+c.y*s, c.isPlayer?4:3, 0, 7); mmx.fill();
  });
}

        <input id="roomNameInput" type="text" placeholder="输入房间名" style="padding:12px 16px;font-size:15px;border:1px solid rgba(255,255,255,.2);border-radius:8px;background:rgba(255,255,255,.06);color:#e6edf3;outline:none;width:280px;text-align:center;margin-bottom:16px;" />
        <div style="display:flex;gap:12px;justify-content:center;">
          <button id="cancelRoomBtn" style="padding:10px 28px;font-size:14px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(255,255,255,.06);color:#c9d1d9;cursor:pointer;">取消</button>
          <button id="confirmRoomBtn" style="padding:10px 28px;font-size:14px;font-weight:700;border:none;border-radius:10px;color:#0d1117;background:linear-gradient(90deg,#58a6ff,#7ee787);cursor:pointer;">确定创建</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    document.getElementById('roomNameInput').focus();
    document.getElementById('cancelRoomBtn').onclick = function(){ document.body.removeChild(modal); };
    document.getElementById('confirmRoomBtn').onclick = function(){
      const name = document.getElementById('roomNameInput').value.trim();
      if(!name){ document.getElementById('roomNameInput').focus(); return; }
      // TODO: 实际网络创建房间逻辑
      document.body.removeChild(modal);
      alert('房间「' + name + '」已创建！\n（网络功能开发中，当前为本地演示）');
    };
    document.getElementById('roomNameInput').addEventListener('keydown', function(e){
      if(e.key === 'Enter') document.getElementById('confirmRoomBtn').click();
    });
  };

  // 搜索房间按钮
  document.getElementById('searchRoomBtn').onclick = function(){
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7);';
    modal.innerHTML = `
      <div style="background:#161b22;border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:30px;min-width:360px;text-align:center;">
        <h2 style="font-size:20px;color:#e6edf3;margin-bottom:20px;">搜索房间</h2>
        <input id="searchRoomInput" type="text" placeholder="输入房间名搜索" style="padding:12px 16px;font-size:15px;border:1px solid rgba(255,255,255,.2);border-radius:8px;background:rgba(255,255,255,.06);color:#e6edf3;outline:none;width:280px;text-align:center;margin-bottom:16px;" />
        <div id="searchResults" style="max-height:200px;overflow-y:auto;margin-bottom:16px;text-align:left;"></div>
        <div style="display:flex;gap:12px;justify-content:center;">
          <button id="closeSearchBtn" style="padding:10px 28px;font-size:14px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(255,255,255,.06);color:#c9d1d9;cursor:pointer;">关闭</button>
          <button id="doSearchBtn" style="padding:10px 28px;font-size:14px;font-weight:700;border:none;border-radius:10px;color:#0d1117;background:linear-gradient(90deg,#58a6ff,#7ee787);cursor:pointer;">搜索</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    document.getElementById('searchRoomInput').focus();
    document.getElementById('closeSearchBtn').onclick = function(){ document.body.removeChild(modal); };
    document.getElementById('doSearchBtn').onclick = function(){
      const q = document.getElementById('searchRoomInput').value.trim();
      const resultsDiv = document.getElementById('searchResults');
      if(!q){ resultsDiv.innerHTML = '<p style="color:#8b949e;font-size:13px;text-align:center;">请输入房间名</p>'; return; }
      // TODO: 实际网络搜索逻辑
      resultsDiv.innerHTML = '<p style="color:#8b949e;font-size:13px;text-align:center;">未找到房间「' + q + '」\n（网络功能开发中）</p>';
    };
    document.getElementById('searchRoomInput').addEventListener('keydown', function(e){
      if(e.key === 'Enter') document.getElementById('doSearchBtn').click();
    });
  };
}
function showResults(){
  updateStanding();
  document.getElementById('overlay').classList.remove('hidden');
  renderMenu(true);
}
function startRace(){
  initAudio();
  isCityMode = false;
  resetGame();
  applyDayNight();
  state='countdown'; countdown=3000;
  const ov=document.getElementById('overlay');
  ov.classList.add('hidden');
  ov.innerHTML=`<div id="countdown">3</div>`;
}
function startFreeMode(){
  initAudio();
  isCityMode = true;
  resetGame();
  applyDayNight();
  state='free';   // 自由模式：无倒计时、无圈数限制
  const ov=document.getElementById('overlay');
  ov.classList.add('hidden');
  ov.innerHTML='';
}

/* ---------- 启动 ---------- */
function boot(){
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('overlay').classList.remove('hidden');
  renderMenu(false);
  isCityMode = false;  // 菜单背景用竞速地图
  resetGame();
  const fx=Math.cos(START_ANG), fy=Math.sin(START_ANG);
  const k = carScale(player.carTypeIdx)/2;
  camPos.x=player.x - fx*13*k; camPos.y=7*k; camPos.z=player.y - fy*13*k;
  camera.position.set(camPos.x,camPos.y,camPos.z);
  camera.lookAt(player.x,1,player.y);
  updateCarMeshes();
  requestAnimationFrame(loop);
}
// 等待 Three.js UMD 加载完成
function waitForThree(){
  if(window.THREE){ initThree(); boot(); }
  else setTimeout(waitForThree, 50);
}
waitForThree();
</script>
