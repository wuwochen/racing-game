<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>极速博弈 3D · 赛车游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1117; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #e6edf3; }
  .center { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .logo { font-size: 48px; font-weight: 900; background: linear-gradient(90deg, #58a6ff, #7ee787); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 16px; }
  .msg { color: #8b949e; font-size: 16px; margin-bottom: 24px; }
  .btn { padding: 12px 32px; font-size: 15px; font-weight: 700; border: none; border-radius: 10px; color: #0d1117; background: linear-gradient(90deg, #58a6ff, #7ee787); cursor: pointer; text-decoration: none; }
</style>
</head>
<body>
<div class="center">
  <div class="logo">🏁 极速博弈 3D</div>
  <div class="msg">正在加载，请稍候...</div>
  <a class="btn" href="https://wuwochen.github.io/racing-game/">进入游戏</a>
</div>
<script>
// 自动跳转到主页
setTimeout(function(){
  window.location.href = 'https://wuwochen.github.io/racing-game/';
}, 1500);
</script>
</body>
</html>
